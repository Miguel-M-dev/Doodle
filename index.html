<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doodle Guesser</title>
<link rel="stylesheet" href="engine/style.css">
</head>
<body class="theme-paper">

<div id="app">
  <header id="top">
    <div>
      <h1 id="title">Loading the drawings…</h1>
      <p id="byline"></p>
    </div>
    <button id="btn-problems" type="button">Checking…</button>
  </header>
  <div id="notice" hidden></div>
  <nav id="modes" role="tablist" aria-label="What to do">
    <button type="button" role="tab" data-mode="play">Play</button>
    <button type="button" role="tab" data-mode="guess">Guess my drawing</button>
    <button type="button" role="tab" data-mode="teach">Teach</button>
    <button type="button" role="tab" data-mode="drawings">The drawings</button>
    <button type="button" role="tab" data-mode="report">Report card</button>
  </nav>
  <main id="main">
    <section id="stage">
      <div id="prompt"></div>
      <div id="timer" hidden><div id="timer-fill"></div></div>
      <canvas id="pad" aria-label="Drawing pad. Draw here with your mouse, finger or pen."></canvas>
      <div id="pad-tools"></div>
    </section>
    <aside id="side" aria-live="polite"></aside>
  </main>
  <section id="wide" hidden></section>
</div>

<nav id="bar" aria-label="Tools">
  <button id="btn-draft" type="button">Test a draft</button>
</nav>
<p id="help"><kbd>Z</kbd> undo a line &middot; <kbd>C</kbd> clear &middot; <kbd>Enter</kbd> keep a drawing (Teach) &middot; <kbd>Esc</kbd> close</p>
<p id="credit" hidden>Sample drawings from Google's <a href="https://github.com/googlecreativelab/quickdraw-dataset">Quick, Draw! dataset</a>, used under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.</p>

<div id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panel-title">
  <div id="panel-box">
    <div id="panel-head"><h2 id="panel-title"></h2><button id="panel-close" type="button" aria-label="Close">×</button></div>
    <div id="panel-body"></div>
  </div>
</div>

<script src="engine/doodle.js"></script>
<script src="engine/pad.js"></script>
<script src="engine/app.js"></script>
</body>
</html>
